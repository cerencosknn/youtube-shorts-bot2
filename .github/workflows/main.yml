name: YouTube Shorts Otomasyonu

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları GitHub'dan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2 imageio-ffmpeg

      - name: Ubuntu için FFmpeg Kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Gizli Dosyaları Yerine Koy
        run: |
          echo '${{ secrets.CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Otomasyonu Başlat
        run: python otomatik_video.py
